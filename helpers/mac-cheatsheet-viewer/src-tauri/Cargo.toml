[package]
name = "mac-cheatsheet-viewer"
version = "0.1.0"
description = "Borderless always-on-top viewer for the Paneru shortcut cheat sheet"
authors = ["paneru-wm-installer"]
edition = "2021"

[lib]
name = "mac_cheatsheet_viewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cheatsheet-core = { path = "../crates/cheatsheet-core" }