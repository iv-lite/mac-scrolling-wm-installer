# Nehir settings — niri-like scrolling strip, focus-follows-mouse, native
# menu-bar workspace indicators. Generated by nehir-wm-installer. Edit
# freely; every file under ~/.config/nehir/ is watched and applied live —
# no restart, no reload key.
#
# Schema recovered from https://github.com/apphane-dev/nehir
# docs/CONFIGURATION.md and Sources/Nehir/Core/Config/BuiltInSettingsDefaults.swift
# (v0.6.x). Unknown/renamed keys don't block startup — Nehir surfaces them
# as a non-blocking warning in Settings → Diagnostics instead.

[general]
# IPC is off by default; the shortcut cheat-sheet generator and health
# checks in this repo talk to Nehir over `nehirctl`, which needs it on.
ipcEnabled = true
hotkeysEnabled = true

[focus]
# Matches this repo's previous Rift setup: focus follows the mouse, and
# keyboard-driven focus changes warp the cursor to the newly focused
# window. Nehir explicitly does NOT warp the cursor for pointer-initiated
# focus changes (hover/click) — see docs/CONFIGURATION.md "Mouse focus
# behavior" — so this only affects keyboard navigation, same intent as
# Rift's `mouse_follows_focus`.
followsMouse = true
moveMouseToFocusedWindow = true
followsWindowToMonitor = false

# ─── Gaps ───
# `size` is the gap between tiled windows (Rift's old
# `[settings.layout.gaps.inner]`); `[gaps.outer]` is the margin against
# the screen edges (Rift's `[settings.layout.gaps.outer]`).
[gaps]
size = 12.0

[gaps.outer]
top = 12.0
left = 12.0
bottom = 12.0
right = 12.0

# ─── Niri scrolling-column layout ───
# `columnWidthPresets` replaces this repo's old `scripts/cycle-column-width`
# hack entirely: Rift had no numeric width-preset primitive, so that script
# computed exact resize deltas via `rift-cli query layout` to fake a
# 0.3/0.5/1.0 cycle. Nehir cycles through this exact array natively via the
# "Cycle column width" hotkey — no external script involved.
[niri]
columnWidthPresets = [0.3, 0.5, 1.0]
infiniteLoop = false

# ─── Window borders ───
# JankyBorders (config/borders/bordersrc) is kept for its distinct
# active/inactive colors, which Nehir's own single-color border can't do —
# so Nehir's native border stays off to avoid drawing two borders at once.
[borders]
enabled = false

# ─── Workspace bar (native menu-bar workspace indicators) ───
[workspaceBar]
enabled = true
showLabels = true
hideEmptyWorkspaces = false
position = "overlappingMenuBar"

[gestures]
fingerCount = 3
scrollEnabled = true
invertDirection = false

[appearance]
mode = "dark"
