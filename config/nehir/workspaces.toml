# Nehir workspaces — one per monitor (not a fixed 1-9 set): a single
# scrolling-strip workspace per display is enough, since the niri-style
# layout already handles many windows on one workspace via horizontal
# scrolling. Generated by nehir-wm-installer.
#
# Format: docs/CONFIGURATION.md / Sources/Nehir/Core/Config/WorkspacesTOMLCodec.swift
# — one `[<name>]` table per workspace; omitted `monitor` defaults to "main".

[1]
# main monitor (omitted `monitor` defaults to "main")

[2]
monitor = "secondary"

[3]
monitor = "tertiary"
# Only resolves if a 3rd display is connected; harmless placeholder
# otherwise — this is a static config, so true N-monitor support isn't
# possible without knowing the connected monitor count in advance.
