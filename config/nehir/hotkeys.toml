# Nehir hotkeys — re-encodes this repo's Cmd+Option/Cmd+Ctrl/Ctrl+Option
# muscle memory from the previous Rift setup (config/rift/config.toml's
# [modifier_combinations]/[keys]) onto Nehir's fixed action catalog.
# Generated by nehir-wm-installer. Live-reloaded, edit freely.
#
# Format: docs/CONFIGURATION.md / Sources/Nehir/Core/Config/HotkeysTOMLCodec.swift
# ("Modifier+Modifier+Key", "{N}" expands to digit keys 1-9). Valid
# section/key names and the modifier/key vocabulary come from
# Sources/Nehir/Core/Config/HotkeyConfigMapping.swift and
# Sources/Nehir/Core/Input/KeySymbolMapper.swift.
#
# Unlike Rift's `{ exec = [...] }` bindings, Nehir hotkeys can only trigger
# its own built-in actions — there is no generic "run a shell command"
# binding. Three things this repo used to bind that way have no Nehir
# equivalent and are intentionally NOT in this file (see README's
# Keybindings section for the full explanation):
#   - Cmd+Ctrl+T          "open Ghostty"            → use Spotlight/Dock instead
#   - Cmd+Shift+?         cheat-sheet viewer         → run
#     `~/.config/mac-scrolling-wm/helpers/display-shortcuts` manually
#   - Cmd+Option+Shift+R  "reload config"            → unnecessary now,
#     every file under ~/.config/nehir/ always live-reloads
#
# Also NOT bound, because Nehir has no matching action at all (documented
# as a real behavior change from Rift, not an oversight):
#   - move a window to a display in a direction (Rift's dispShift+Arrows)
#   - warp just the mouse to a display in a direction (Rift's
#     mouseDisp+Arrows) — mouse warp is automatic/continuous now, native
#     to Nehir (see [mouseWarp] in settings.toml), no hotkey needed
#   - "center the focused column" (Rift's main+Space)
#   - "toggle orientation" (Rift's main+Slash) — orientation is a static
#     per-monitor setting now (monitors.d/*.toml [orientation]), not a
#     runtime toggle

[workspace]
switch = "Option+Command+{N}"
moveTo = "Option+Shift+Command+{N}"
backAndForth = "Option+Command+Tab"
next = "Control+Option+Down Arrow"
previous = "Control+Option+Up Arrow"

[focus]
left = "Option+Command+Left Arrow"
down = "Option+Command+Down Arrow"
up = "Option+Command+Up Arrow"
right = "Option+Command+Right Arrow"
# Rift's disp+Left/Right (focus_display in a direction). Nehir's monitor
# focus model is next/previous/last, not 4-directional — Left/Right are
# the closest fit; Up/Down have no meaningful equivalent and are dropped.
monitorNext = "Control+Command+Right Arrow"
monitorPrevious = "Control+Command+Left Arrow"

[move]
left = "Option+Shift+Command+Left Arrow"
down = "Option+Shift+Command+Down Arrow"
up = "Option+Shift+Command+Up Arrow"
right = "Option+Shift+Command+Right Arrow"
# Closest match for Rift's main+Ctrl+E ("unjoin_windows" out of the
# layout tree) — expelling a window from its column is the same idea.
expelFromColumn = "Option+Control+Command+E"

[layout]
cycleColumnWidthForward = "Option+Command+W"
cycleColumnWidthBackward = "Option+Shift+Command+W"
# Rift's main+M jumped the focused column straight to full width, tiled —
# this is the exact native equivalent (no more shelling out to
# cycle-column-width max).
toggleColumnFullWidth = "Option+Command+M"
toggleFocusedFloating = "Option+Command+V"
# Rift's main+O ("toggle_stack") ≈ Nehir's stacked/tabbed column display.
toggleColumnTabbed = "Option+Command+O"

[debugging]
# Closest match for Rift's mainShift+D ("debug") — gated behind Developer
# Mode in Nehir's Settings → Diagnostics.
toggleTraceCapture = "Option+Shift+Command+D"
