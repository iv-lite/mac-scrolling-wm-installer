# Rift config — niri-like scrolling layout, Option-key shortcuts
# Generated by rift-wm-installer. Edit freely; hot reload is on.

[settings]
# ─── Animations ───
animate = true
animation_duration = 0.3
animation_fps = 120.0

# ─── Mouse/Focus behavior (keyboard-driven, no focus-follows-mouse) ───
focus_follows_mouse = false
mouse_follows_focus = false
mouse_hides_on_focus = false

# Prevent these apps from stealing focus / triggering workspace switches
auto_focus_blacklist = [
  "com.apple.dock",
  "com.apple.systemuiserver",
  "com.apple.SecurityAgent",
  "com.apple.Spotlight",
]

# ─── Config hot reload ───
hot_reload = true

# Manage every macOS Space automatically (multi-monitor: no Option+Z per Space).
# Toggle individual Spaces off anytime with Option+Z.
default_disable = false

[settings.layout]
# niri-style scrollable columns
mode = "scrolling"
# Multi-monitor: arrange displays VERTICALLY (System Settings → Displays).
# New windows appended at the end of the strip (never resize existing).
window_insertion_point = "end_of_tree"

[settings.layout.scrolling]
# Width of the focused column as a fraction of screen width
column_width_ratio = 0.5
min_column_width_ratio = 0.3
max_column_width_ratio = 0.9
# Keep the focused column centered like niri
alignment = "center"
# niri-style reveal-on-navigate focus behaviour
focus_navigation_style = "niri"
animate = true

[settings.layout.scrolling.gestures]
# Horizontal scroll (trackpad) switches columns
enabled = true
invert_horizontal = false
fingers = 3
# Scrolling past the end flows into the next/prev workspace
propagate_to_workspace_swipe = true

[settings.layout.gaps]
# Nord-friendly breathing room around windows
[settings.layout.gaps.outer]
top = 15
left = 15
bottom = 15
right = 15

[settings.layout.gaps.inner]
horizontal = 12
vertical = 12

# Per-display gap overrides (optional, multi-monitor).
# Get your display UUIDs with:  rift-cli query displays
# [settings.layout.gaps.per_display."<display-uuid>".outer]
#   top = 8
#   left = 8
#   bottom = 8
#   right = 8
# [settings.layout.gaps.per_display."<display-uuid>".inner]
#   horizontal = 8
#   vertical = 8

# Rift's built-in menu-bar indicators are DISABLED — Aegis is the bar now
# (draws its own notch-safe menu bar + workspace indicators for Rift).
[settings.ui.menu_bar]
enabled = false

[settings.gestures]
# Trackpad swipes switch virtual workspaces (like native macOS)
enabled = true
consume_dock_swipe = true
skip_empty = true
fingers = 3
haptics_enabled = true

[settings.window_snapping]
drag_swap_fraction = 0.3

[virtual_workspaces]
enabled = true
default_workspace_count = 9
auto_assign_windows = true
preserve_focus_per_workspace = true
workspace_auto_back_and_forth = false
prevent_wrapping = false
reapply_app_rules_on_title_change = false

workspace_rules = []
# Named after their Alt+number. Rift workspace ids are 0-based.
workspace_names = [
  "1", "2", "3", "4", "5", "6", "7", "8", "9"
]

# ─── App rules ───
app_rules = [
  # Floating utility windows
  { app_id = "com.apple.calculator", floating = true, size = { w = 360, h = 480 } },
  { app_name = "System Settings", floating = true },
  { title_substring = "Preferences", floating = true },
]

[modifier_combinations]
comb1 = "Alt + Shift"

[keys]
# ─── Space activation ───
"Alt + Z" = "toggle_space_activated"

# ─── Window focus (Option+Arrows) ───
"Alt + Up"    = { move_focus = "up" }
"Alt + Down"  = { move_focus = "down" }
"Alt + Left"  = { move_focus = "left" }
"Alt + Right" = { move_focus = "right" }

# ─── Move window (Option+Shift+Arrows) ───
"comb1 + Up"    = { move_node = "up" }
"comb1 + Down"  = { move_node = "down" }
"comb1 + Left"  = { move_node = "left" }
"comb1 + Right" = { move_node = "right" }

# ─── Resize (Option+Ctrl+Arrows) ───
"Alt + Ctrl + Right" = { resize_window_grow = "smart" }
"Alt + Ctrl + Left"  = { resize_window_shrink = "smart" }
"Alt + Ctrl + Up"    = { resize_window_grow = "vertical" }
"Alt + Ctrl + Down"  = { resize_window_shrink = "vertical" }

# ─── Workspaces (Option+1-9) ───
"Alt + 1" = { switch_to_workspace = 0 }
"Alt + 2" = { switch_to_workspace = 1 }
"Alt + 3" = { switch_to_workspace = 2 }
"Alt + 4" = { switch_to_workspace = 3 }
"Alt + 5" = { switch_to_workspace = 4 }
"Alt + 6" = { switch_to_workspace = 5 }
"Alt + 7" = { switch_to_workspace = 6 }
"Alt + 8" = { switch_to_workspace = 7 }
"Alt + 9" = { switch_to_workspace = 8 }

# ─── Move window to workspace (Option+Shift+1-9) ───
"comb1 + 1" = { move_window_to_workspace = 0 }
"comb1 + 2" = { move_window_to_workspace = 1 }
"comb1 + 3" = { move_window_to_workspace = 2 }
"comb1 + 4" = { move_window_to_workspace = 3 }
"comb1 + 5" = { move_window_to_workspace = 4 }
"comb1 + 6" = { move_window_to_workspace = 5 }
"comb1 + 7" = { move_window_to_workspace = 6 }
"comb1 + 8" = { move_window_to_workspace = 7 }
"comb1 + 9" = { move_window_to_workspace = 8 }

# ─── Displays (Cmd+Option+Arrows) ───
"Meta + Alt + Left"          = { focus_display = "left" }
"Meta + Alt + Right"         = { focus_display = "right" }
"Meta + Alt + Up"            = { focus_display = "up" }
"Meta + Alt + Down"          = { focus_display = "down" }
"Meta + Alt + Shift + Left"  = { move_window_to_display = { selector = "left" } }
"Meta + Alt + Shift + Right" = { move_window_to_display = { selector = "right" } }
"Meta + Alt + Shift + Up"    = { move_window_to_display = { selector = "up" } }
"Meta + Alt + Shift + Down"  = { move_window_to_display = { selector = "down" } }

# ─── Misc navigation ───
"Alt + Tab" = "switch_to_last_workspace"

# ─── Window state ───
"Alt + F"             = "toggle_fullscreen"
"Alt + Shift + F"     = "toggle_fullscreen_within_gaps"
"Alt + V"             = "toggle_window_floating"
"Alt + Q"             = "close_window"
"Alt + W"             = "toggle_stack"
"Alt + Slash"         = "toggle_orientation"
"Alt + Ctrl + E"      = "unjoin_windows"

# ─── Scroll the strip ───
"Alt + BracketLeft"   = { scroll_strip = { delta = -0.5 } }
"Alt + BracketRight"  = { scroll_strip = { delta = 0.5 } }
"Alt + Space"         = "center_selection"

# ─── Apps ───
"Meta + Ctrl + T" = { "exec" = [
  "/bin/bash", "-c",
  "open -a Ghostty"
] }

# ─── Misc ───
"Alt + Shift + R" = "reload_config"
"Alt + Shift + D" = "debug"