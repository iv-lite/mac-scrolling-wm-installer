# AeroSpace config — i3-like tree tiling, Option-key shortcuts, AeroSpaceBar-friendly
# Generated by aerospace-installer. Edit freely; auto-reload watches this file.

config-version = 2

# ─── Startup ───
start-at-login = true

# Automatically reload the config when this file is saved.
# After enabling, reload once manually to start the auto-reloading (the
# installer does this, or press Option+Shift+R).
auto-reload-config = true

# ─── Workspaces ───
# 1-9 mirrors the previous Rift/Alt+number setup. AeroSpaceBar shows these
# in the menu bar.
persistent-workspaces = ["1", "2", "3", "4", "5", "6", "7", "8", "9"]

# Default layout: i3-like tiles (not a scrolling strip).
default-root-container-layout = "tiles"
default-root-container-orientation = "auto"

accordion-padding = 24

# Mouse/Focus behavior (keyboard-driven, no focus-follows-mouse).
focus-follows-mouse.enabled = false

# ─── Gaps ───
# Breathing room around windows (mirrors the old Rift setup).
# Note: on the built-in display with a notch, AeroSpace measures the top gap
# from the bottom of the notch; on un-notched displays from the very top. When
# the menu bar shows above the notch, keep the notched (main) display's top gap
# smaller. Uncomment to fine-tune per display:
#   gaps.outer.top = [{ monitor.main = 8 }, 15]
# Get your display identifiers with:  aerospace list-monitors
gaps.inner.horizontal = 12
gaps.inner.vertical = 12
gaps.outer.left = 15
gaps.outer.bottom = 15
gaps.outer.top = 15
gaps.outer.right = 15

on-window-detected = [
  {
    if = 'test %{app-name} = "Calculator"',
    run = 'layout floating',
  },
  {
    if = 'test %{app-name} = "System Settings" || test %{app-name} = "System Preferences"',
    run = 'layout floating',
  },
]# ─── App rules ───
# System Settings / Preferences windows float and don't tile.

[mode.main.binding]

# ─── Ghostty (Ctrl+Cmd+T, mirroring the old setup) ───
ctrl-cmd-t = 'exec-and-forget open -a Ghostty'

# ─── Window focus (Option+Arrows) ───
alt-left = 'focus left'
alt-down = 'focus down'
alt-up = 'focus up'
alt-right = 'focus right'

# ─── Move window (Option+Shift+Arrows) ───
alt-shift-left = 'move left'
alt-shift-down = 'move down'
alt-shift-up = 'move up'
alt-shift-right = 'move right'

# ─── Resize (Option+Ctrl+Arrows) ───
alt-ctrl-left = 'resize smart -50'
alt-ctrl-right = 'resize smart +50'
alt-ctrl-up = 'resize height +50'
alt-ctrl-down = 'resize height -50'

# ─── Workspaces (Option+1-9) ───
ctrl-1 = 'workspace 1'
ctrl-2 = 'workspace 2'
ctrl-3 = 'workspace 3'
ctrl-4 = 'workspace 4'
ctrl-5 = 'workspace 5'
ctrl-6 = 'workspace 6'
ctrl-7 = 'workspace 7'
ctrl-8 = 'workspace 8'
ctrl-9 = 'workspace 9'

# ─── Move window to workspace (Option+Shift+1-9) ───
ctrl-shift-1 = 'move-node-to-workspace 1'
ctrl-shift-2 = 'move-node-to-workspace 2'
ctrl-shift-3 = 'move-node-to-workspace 3'
ctrl-shift-4 = 'move-node-to-workspace 4'
ctrl-shift-5 = 'move-node-to-workspace 5'
ctrl-shift-6 = 'move-node-to-workspace 6'
ctrl-shift-7 = 'move-node-to-workspace 7'
ctrl-shift-8 = 'move-node-to-workspace 8'
ctrl-shift-9 = 'move-node-to-workspace 9'

# ─── Display/monitor focus (Cmd+Option+Arrows) ───
cmd-alt-left = 'focus-monitor left'
cmd-alt-down = 'focus-monitor down'
cmd-alt-up = 'focus-monitor up'
cmd-alt-right = 'focus-monitor right'

# ─── Move window to display (Cmd+Option+Shift+Arrows) ───
cmd-alt-shift-left = 'move-node-to-monitor --wrap-around prev'
cmd-alt-shift-right = 'move-node-to-monitor --wrap-around next'
cmd-alt-shift-up = 'move-node-to-monitor --wrap-around prev'
cmd-alt-shift-down = 'move-node-to-monitor --wrap-around next'

# ─── Misc navigation ───
alt-tab = 'workspace-back-and-forth'

# ─── Window state ───
alt-f = 'fullscreen'
alt-v = 'layout floating tiling'               # toggle floating/tiling
alt-q = 'close'
alt-w = 'layout accordion horizontal vertical' # stack-like view
alt-o = 'layout tiles horizontal vertical'     # toggle orientation
alt-ctrl-e = 'flatten-workspace-tree'          # reset layout to tiles

# ─── Misc ───
alt-shift-r = 'reload-config'
alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

# 'service' binding mode (Option+Shift+Semicolon), i3-like maintenance mode.
[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main']                # reset layout
f = ['layout floating tiling', 'mode main']                # toggle floating
b = ['balance-sizes', 'mode main']
backspace = ['close-all-windows-but-current', 'mode main']
