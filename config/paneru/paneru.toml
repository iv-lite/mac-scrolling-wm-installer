# Paneru config — niri-like sliding strip. Modifier lanes:
# Cmd+Option = focus/move columns (within a workspace),
# Cmd+Option+1-9 = switch virtual workspaces, Cmd+Ctrl = displays.
# Generated by paneru-wm-installer. Edit freely; live reload is on.

# ─── Global options ───
[options]
# Focus follows the mouse; keyboard focus warps the cursor to the focused window
focus_follows_mouse = true
mouse_follows_focus = true

# Screen-width ratios the resize bindings cycle through (replaces Rift's
# Alt+W 0.3 / 0.5 / 1.0). 1.0 = a full-width "page".
preset_column_widths = [0.3, 0.5, 1.0]

# Speed of window animations (8-20). Comfortable mid value.
animation_speed = 12.0

# Center the focused window when focus changes (niri-style reveal-on-navigate)
auto_center = false

# Open virtual workspaces on demand (niri-style dynamic rows)
create_virtual_workspace_automatically = true

# Drop a virtual workspace row once it has no windows
reap_empty_workspaces = true

# Keep preset cycling wrapping instead of stopping at the ends
window_resize_cycle = true

# ─── Screen padding (outer gaps; Paneru has no inner-gap option) ───
[padding]
top = 15
bottom = 15
left = 15
right = 15

# ─── Swipe & gestures ───
[swipe]
# With continuous = false the strip never moves past the left/right-most
# window: a full 3-finger swipe lands exactly on the next full-width window
# (page-flip), never resting mid-window.
continuous = false
sensitivity = 0.35
deceleration = 4.0

[swipe.gesture]
# 3-finger horizontal swipe scrolls the strip (snaps on release);
# vertical 3-finger swipes switch virtual workspace rows.
fingers_count = 3
direction = "Natural"
vertical = true

[swipe.scroll]
# Cmd + Option + scroll wheel slides the strip horizontally
modifier = "cmd + alt"

# ─── Decorations ───
[decorations]
# Menu-bar workspace indicator is OFF by default: the status item hosts a live
# NSView, and AppKit's menu-bar "replicant" redraw loop starves the run loop
# that services Paneru's CGEventTap, so macOS disables the tap and keybindings
# silently stop working — most noticeably right after leaving native fullscreen
# (when the menu bar re-shows). Upstream fix: karinushka/paneru#390 (draw an
# image instead of a live view), merged to main after v0.5.0 and not yet in any
# release. Keep workspace_menu_status = false until a Paneru release ships that
# fix; note that flipping it to true needs a `paneru restart` to take effect.
workspace_menu_status = false
# Brief status popup on virtual workspace switch
workspace_popup_status = true

[decorations.menu.indicator]
# "3 / 5" style: current workspace over total
style = "paged"
format = "default"
font_size = 13.0

# Native macOS dimming for inactive windows — disabled (focus cue comes from
# the active border instead)
[decorations.inactive.dim]
opacity = 0.0
opacity_night = 0.0

# Focus border (replaces JankyBorders)
[decorations.active.border]
enabled = true
color = "#89b4fa"
opacity = 1.0
width = 4.0
radius = "auto"

# ─── Keybindings ───
[bindings]
# ─── Window focus (Cmd+Option+Arrows) ───
window_focus_west = "cmd + alt - leftarrow"
window_focus_east = "cmd + alt - rightarrow"
window_focus_north = "cmd + alt - uparrow"
window_focus_south = "cmd + alt - downarrow"

# ─── Move window (Cmd+Option+Shift+Arrows) ───
window_swap_west = "cmd + alt + shift - leftarrow"
window_swap_east = "cmd + alt + shift - rightarrow"
window_swap_north = "cmd + alt + shift - uparrow"
window_swap_south = "cmd + alt + shift - downarrow"

# ─── Column width (Cmd+Option+W) ───
window_resize = "cmd + alt - w"
window_shrink = "cmd + alt + shift - w"
window_fullwidth = "cmd + alt - m"

# ─── Workspaces (Ctrl+Option+↑/↓ = cycle dynamic rows; Shift = move & follow) ───
window_virtual_north = "ctrl + alt - uparrow"
window_virtual_south = "ctrl + alt - downarrow"
window_virtualmove_north = "ctrl + alt + shift - uparrow"
window_virtualmove_south = "ctrl + alt + shift - downarrow"
window_focus_managed = "cmd + alt - tab"
# Workspace rows are created on demand (south past the last row spawns one)
# and reaped when empty; the 3-finger vertical swipe also cycles them.

# ─── Displays (Cmd+Ctrl+→ = focus next display; +Shift = move & stay; ↑ = warp mouse) ───
window_nextdisplay = "cmd + ctrl - rightarrow"
window_nextdisplaysend = "cmd + ctrl + shift - rightarrow"
mouse_nextdisplay = "cmd + ctrl - uparrow"

# ─── Window state ───
window_manage = "cmd + alt - v"          # toggle tiled/floating
window_stack = "cmd + alt - o"           # stack into the neighbour column
window_unstack = "cmd + alt + shift - o" # pull out of a stack into its own column
window_center = "cmd + alt - space"
window_snap = "cmd + alt + shift - space" # snap an overflowing window into view
window_equalize = "cmd + alt + shift - e"
window_balance = "cmd + alt - b"          # all columns match the focused width
window_copyrule = "cmd + alt + shift - c"

# ─── Misc ───
restart = "cmd + alt + shift - r"
quit = "cmd + alt + ctrl - q"

# ─── Window rules ───
[windows.calculator]
title = ".*"
bundle_id = "com.apple.calculator"
floating = true

[windows.preferences]
title = "Preferences"
floating = true

# ─── Inner gaps (Paneru has no global inner-gap option, so this applies
# per-window padding to every tiled window) ───
[windows.default]
title = ".*"
horizontal_padding = 8
vertical_padding = 8

# ─── Session restore (startup-only) ───
[restore]
enabled = true
startup_grace_ms = 2000
missing_windows = "ignore"